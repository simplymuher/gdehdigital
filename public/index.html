<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <meta name="theme-color" content="#C00000">
  <meta name="description" content="GADEH Student Portal Login">  <title>GADEH Student Portal - Login</title>  <!-- =========================================================
       TYPOGRAPHY
  ========================================================== -->  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >  <style>

    /* =========================================================
       1. GLOBAL RESET
    ========================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Plus Jakarta Sans',sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      background:#ffffff;
      color:#222222;
      display:flex;
      flex-direction:column;
    }

    a{
      text-decoration:none;
    }

    button,
    input{
      font-family:inherit;
    }


    /* =========================================================
       2. MAIN CONTAINER
    ========================================================== */

    .page{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .main-container{
      flex:1;
      width:100%;
      max-width:390px;
      margin:0 auto;
      padding:30px 18px 25px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }


    /* =========================================================
       3. BRAND LOGO
    ========================================================== */

    .brand-logo-container{
      width:100%;
      text-align:center;
      margin-bottom:20px;
    }

    .brand-logo-container img{
      width:58px;
      height:58px;
      object-fit:contain;
      display:block;
      margin:0 auto;
    }


    /* =========================================================
       4. CORPORATE ACCENT
    ========================================================== */

    .brand-line{
      width:48px;
      height:3px;
      margin:12px auto 0;

      background:linear-gradient(
        90deg,
        #C00000 0%,
        #C00000 50%,
        #2E7D32 50%,
        #2E7D32 100%
      );

      border-radius:10px;
    }


    /* =========================================================
       5. LOGIN CARD
    ========================================================== */

    .login-card{
      width:100%;
      background:#ffffff;

      border:1px solid #e7e7e7;
      border-top:3px solid #C00000;

      border-radius:10px;

      padding:25px 22px;

      box-shadow:
        0 5px 18px rgba(0,0,0,0.05);

      margin-bottom:22px;
    }


    /* =========================================================
       6. LOGIN TITLE
    ========================================================== */

    .login-card h2{
      color:#222222;
      font-size:1rem;
      line-height:1.4;
      font-weight:700;

      text-align:center;
      text-transform:uppercase;

      letter-spacing:.45px;

      margin-bottom:5px;
    }

    .login-subtitle{
      color:#666666;
      font-size:.68rem;
      font-weight:400;

      text-align:center;
      line-height:1.5;

      margin-bottom:21px;
    }


    /* =========================================================
       7. FORM GROUP
    ========================================================== */

    .form-group{
      position:relative;
      margin-bottom:15px;
    }

    .form-group label{
      display:block;

      color:#222222;

      font-size:.68rem;
      font-weight:700;

      text-transform:uppercase;
      letter-spacing:.35px;

      margin-bottom:6px;
    }

    .form-group input{
      width:100%;

      height:42px;

      padding:0 12px;

      background:#ffffff;
      color:#222222;

      border:1px solid #d9d9d9;
      border-radius:6px;

      outline:none;

      font-size:.76rem;
      font-weight:400;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .form-group input::placeholder{
      color:#999999;
    }

    .form-group input:focus{
      border-color:#C00000;

      box-shadow:
        0 0 0 2px rgba(192,0,0,.08);
    }


    /* =========================================================
       8. FORM OPTIONS
    ========================================================== */

    .form-options{
      display:flex;
      justify-content:space-between;
      align-items:center;

      gap:10px;

      margin:17px 0 19px;
    }

    .remember-me{
      display:flex;
      align-items:center;

      gap:6px;

      color:#222222;

      font-size:.67rem;
      font-weight:500;

      cursor:pointer;
      white-space:nowrap;
    }

    .remember-me input{
      width:13px;
      height:13px;

      accent-color:#2E7D32;

      cursor:pointer;
    }

    .forgot-link{
      color:#C00000;

      font-size:.65rem;
      font-weight:600;

      text-align:right;
      line-height:1.3;
    }

    .forgot-link:hover{
      text-decoration:underline;
    }


    /* =========================================================
       9. LOGIN BUTTON
    ========================================================== */

    .login-submit-btn{
      width:100%;

      height:42px;

      border:none;
      border-radius:6px;

      background:#C00000;
      color:#ffffff;

      font-size:.75rem;
      font-weight:700;

      letter-spacing:.35px;

      cursor:pointer;

      transition:
        background .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
    }

    .login-submit-btn:hover{
      background:#222222;

      box-shadow:
        0 4px 10px rgba(0,0,0,.12);
    }

    .login-submit-btn:active{
      transform:translateY(1px);
    }


    /* =========================================================
       10. SECURITY NOTE
    ========================================================== */

    .security-note{
      display:flex;
      justify-content:center;
      align-items:center;

      gap:6px;

      margin-top:14px;

      color:#666666;

      font-size:.62rem;
      font-weight:500;

      text-align:center;
    }

    .security-dot{
      width:6px;
      height:6px;

      background:#2E7D32;

      border-radius:50%;
    }


    /* =========================================================
       11. NAVIGATION LINKS
    ========================================================== */

    .ancillary-nav-grid{
      width:100%;

      display:flex;
      flex-wrap:wrap;

      justify-content:center;
      align-items:center;

      column-gap:14px;
      row-gap:9px;

      padding:4px 4px;
    }

    .ancillary-link{
      position:relative;

      color:#C00000;

      font-size:.67rem;
      font-weight:600;

      line-height:1.4;

      transition:
        color .2s ease,
        opacity .2s ease;
    }

    .ancillary-link:hover{
      color:#2E7D32;
    }

    .ancillary-link.portal-anchor{
      color:#222222;
      font-weight:700;
    }

    .ancillary-link.portal-anchor:hover{
      color:#C00000;
    }


    /* =========================================================
       12. NAVIGATION SEPARATOR
    ========================================================== */

    .ancillary-link:not(:last-child)::after{
      content:"";

      position:absolute;

      width:3px;
      height:3px;

      background:#2E7D32;

      border-radius:50%;

      right:-9px;
      top:50%;

      transform:translateY(-50%);
    }


    /* =========================================================
       13. FOOTER
    ========================================================== */

    .footer{
      width:100%;

      background:#ffffff;

      border-top:1px solid #eeeeee;

      padding:17px 15px 18px;

      text-align:center;
    }

    .footer p{
      color:#222222;

      font-size:.67rem;
      font-weight:700;

      line-height:1.6;

      margin:0;
    }

    .footer p:first-child{
      font-weight:700;
    }

    .footer p:last-child{
      color:#222222;

      font-size:.61rem;
      font-weight:600;

      margin-top:2px;
    }


    /* =========================================================
       14. RESPONSIVE DESIGN
    ========================================================== */

    @media(max-width:360px){

      .main-container{
        padding-left:14px;
        padding-right:14px;
      }

      .login-card{
        padding:23px 18px;
      }

      .form-options{
        align-items:flex-start;
      }

      .forgot-link{
        max-width:145px;
      }

      .ancillary-nav-grid{
        column-gap:11px;
      }

      .ancillary-link{
        font-size:.63rem;
      }
    }


    @media(min-width:600px){

      .main-container{
        max-width:400px;
      }

      .login-card{
        padding:28px 25px;
      }
    }

  </style></head><body><div class="page">  <!-- =======================================================
       MAIN CONTENT
  ======================================================== -->  <main class="main-container"><!-- BRAND LOGO -->

<div class="brand-logo-container">

  <img
    src="/gdeh_logo.png"
    alt="GADEH Logo"
  >

  <div class="brand-line"></div>

</div>


<!-- LOGIN CARD -->

<section class="login-card">

  <h2>
    GADEH Student Portal
  </h2>

  <p class="login-subtitle">
    Secure student access
  </p>


  <!-- LOGIN FORM -->

  <form id="loginForm">


    <!-- FULL NAME -->

    <div class="form-group">

      <label for="studentName">
        Full Name
      </label>

      <input
        type="text"
        id="studentName"
        name="studentName"
        placeholder="Enter your full name"
        required
        autocomplete="name"
      >

    </div>


    <!-- REGISTRATION NUMBER -->

    <div class="form-group">

      <label for="regNumber">
        Registration Number
      </label>

      <input
        type="text"
        id="regNumber"
        name="regNumber"
        placeholder="Enter registration number"
        required
        autocomplete="username"
      >

    </div>


    <!-- OPTIONS -->

    <div class="form-options">

      <label
        class="remember-me"
        for="rememberMe"
      >

        <input
          type="checkbox"
          id="rememberMe"
          name="rememberMe"
        >

        <span>
          Remember Me
        </span>

      </label>


      <a
        href="/forgot_regNumber.html"
        class="forgot-link"
      >
        Forgot Registration Number?
      </a>

    </div>


    <!-- LOGIN BUTTON -->

    <button
      type="submit"
      class="login-submit-btn"
    >
      Login
    </button>


    <!-- SECURITY NOTE -->

    <div class="security-note">

      <span class="security-dot"></span>

      Secure Student Management System

    </div>

  </form>

</section>


<!-- =====================================================
     PORTAL NAVIGATION
====================================================== -->

<nav
  class="ancillary-nav-grid"
  aria-label="Portal navigation"
>

  <a
    href="https://garissadigitaltraining.onrender.com"
    class="ancillary-link portal-anchor"
  >
    Home
  </a>

  <a
    href="https://garissadigitaltraining.onrender.com/about.html"
    class="ancillary-link"
  >
    About Us
  </a>

  <a
    href="https://garissadigitaltraining.onrender.com/services.html"
    class="ancillary-link"
  >
    Services
  </a>

  <a
    href="https://garissadigitaltraining.onrender.com/contact.html"
    class="ancillary-link"
  >
    Contacts
  </a>

  <a
    href="https://garissadigitaltraining.onrender.com/teamcbo.html"
    class="ancillary-link"
  >
    Team
  </a>

  <a
    href="https://garissadigitaltraining.onrender.com/landing.html"
    class="ancillary-link"
  >
    Partnerships
  </a>

  <a
    href="https://garissadigitaltraining.onrender.com/courses.html"
    class="ancillary-link"
  >
    Programmes
  </a>

  <a
    href="/track-certificate"
    class="ancillary-link"
  >
    Track Application
  </a>

  <a
    href="https://gdehexm.onrender.com/verify"
    class="ancillary-link"
  >
    Document Verification
  </a>

</nav>

  </main>  <!-- =======================================================
       FOOTER
  ======================================================== -->  <footer class="footer"><p>
  © GADEH CBO Student Portal. All Rights Reserved.
</p>

<p>
  Secure Management Systems
</p>

</html>
